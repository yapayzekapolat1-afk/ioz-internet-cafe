<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>iOZ Cafe 3D</title>
<link rel="stylesheet" href="style.css" />
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
</head>
<body>

  <div id="three-mount"></div>

  <div id="portrait-overlay" hidden>
    <p>Bu oyun yatay ekran için tasarlandı — cihazını çevir.</p>
  </div>

  <div id="ad-overlay" hidden>
    <div class="spinner"></div>
    <p id="ad-overlay-text">Reklam yükleniyor…</p>
  </div>

  <button id="btn-fullscreen" class="pill-btn top-right">Tam ekran</button>

  <div id="hud-topleft">
    <div id="hud-money" class="pill">₺<span id="money-val">100</span></div>
    <div id="hud-day" class="pill">Gün <span id="day-val">1</span></div>
    <button id="btn-vip" class="pill vip-off">VIP (test)</button>
  </div>

  <div id="action-msg" class="pill toast" hidden></div>

  <div id="hud-actions">
    <button id="btn-ad-quick" class="pill action-btn">+3000 ₺ reklam (<span id="ad-quick-left">3</span>/3)</button>
    <button id="btn-end-day" class="pill action-btn">Günü bitir (reklam izle)</button>
  </div>

  <button id="btn-chat-toggle" class="pill chat-toggle">💬 Sohbet</button>

  <div id="chat-panel" hidden>
    <div class="chat-header">
      <span>Sohbet</span>
      <button id="btn-chat-close">✕</button>
    </div>
    <div id="chat-name-row">
      <input id="chat-name-input" maxlength="24" placeholder="Görünecek adın…" />
    </div>
    <div id="chat-status"></div>
    <div id="chat-messages"></div>
    <div class="chat-input-row">
      <input id="chat-input" maxlength="240" placeholder="Mesaj yaz…" />
      <button id="btn-chat-send">➤</button>
    </div>
  </div>

  <div id="joystick-base">
    <div id="joystick-stick"></div>
  </div>

  <button id="btn-action">✋</button>

  <script src="game.js"></script>
</body>
</html>
