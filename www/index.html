<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>iOZ Cafe 3D</title>
<link rel="stylesheet" href="style.css" />
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
</head>
<body>

  <div id="three-mount"></div>

  <div id="portrait-overlay" hidden>
    <p>Bu oyun yatay ekran için tasarlandı — cihazını çevir.</p>
  </div>

  <div id="ad-overlay" hidden>
    <div class="spinner"></div>
    <p id="ad-overlay-text">Reklam yükleniyor…</p>
  </div>

  <div id="hud-top">
    <div id="hud-money" class="pill">₺<span id="money-val">100</span></div>
    <div id="hud-day" class="pill">Gün <span id="day-val">1</span></div>
    <button id="btn-vip" class="pill vip-off">VIP</button>
    <button id="btn-ad-quick" class="pill action-btn">+3000₺ (<span id="ad-quick-left">3</span>)</button>
    <button id="btn-end-day" class="pill action-btn">Günü Bitir</button>
    <button id="btn-shop" class="pill action-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      Dükkan
    </button>
    <button id="btn-light" class="pill action-btn light-on" title="Tavan ışığı">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2.05V17h6v-.25c0-.85.4-1.55 1-2.05A7 7 0 0 0 12 2Z"/></svg>
    </button>
    <button id="btn-chat-toggle" class="pill action-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
      Sohbet
    </button>
  </div>

  <div id="action-msg" class="pill toast" hidden></div>

  <div id="chat-panel" hidden>
    <div class="chat-header">
      <span>Sohbet <span id="chat-active-count" class="chat-active"></span></span>
      <button id="btn-chat-close" class="icon-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="chat-name-row">
      <input id="chat-name-input" maxlength="24" placeholder="Görünecek adın…" />
    </div>
    <div id="chat-status"></div>
    <div id="chat-messages"></div>
    <div class="chat-input-row">
      <input id="chat-input" maxlength="240" placeholder="Mesaj yaz…" />
      <button id="btn-chat-send" class="icon-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <div id="shop-panel" hidden>
    <div class="chat-header">
      <span>Dükkan</span>
      <button id="btn-shop-close" class="icon-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="shop-status"></div>
    <div id="shop-items"></div>
    <button id="btn-build-station" class="pill action-btn build-btn">İstasyon Kur (1 Masa + 1 Sandalye + 1 Bilgisayar)</button>
  </div>

  <div id="placement-toolbar" hidden>
    <span class="placement-hint">Yerleştirmek istediğin yere yürü/bak, sonra döndür veya onayla</span>
    <button id="btn-place-rotate" class="pill action-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      Döndür
    </button>
    <button id="btn-place-confirm" class="pill action-btn confirm">Yerleştir</button>
    <button id="btn-place-cancel" class="pill action-btn cancel">İptal</button>
  </div>

  <div id="joystick-base">
    <div id="joystick-stick"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
