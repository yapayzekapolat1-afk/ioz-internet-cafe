name: Build Android APK

# Bu workflow, "npx cap add android" ve Android Studio derlemesini SENİN
# bilgisayarında değil, GitHub'ın kendi sunucularında otomatik yapar.
# Sonunda indirip telefonuna kurabileceğin bir .apk dosyası üretir.
#
# ÇALIŞTIRMA: Actions sekmesi -> "Build Android APK" -> "Run workflow"
# butonuna basman yeterli. main dalına her push yaptığında da otomatik
# çalışır.
#
# NOT: Bu workflow burada (Claude tarafından) hiç çalıştırılıp test
# edilemedi — yazan ortamda internet/Android SDK erişimi yok. İlk
# çalıştırmanda küçük bir adımda hata çıkarsa (özellikle "MainActivity
# patch" veya "gradle dependency insert" adımlarında), hata logunu
# kopyalayıp gönder, birlikte düzeltiriz.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java (JDK 21) kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Capacitor bağımlılıklarını kur
        run: npm install

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Unity Ads eklentisini native projeye yerleştir
        run: |
          PKG_PATH="android/app/src/main/java/com/sizinsirketiniz/iozcafe"
          mkdir -p "$PKG_PATH"
          cp android-plugin/UnityAdsBridge.kt "$PKG_PATH/UnityAdsBridge.kt"

          cat > "$PKG_PATH/MainActivity.java" << 'EOF'
          package com.sizinsirketiniz.iozcafe;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(UnityAdsBridge.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Unity Ads Gradle bağımlılığını ekle
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if ! grep -q "com.unity3d.ads:unity-ads" "$GRADLE_FILE"; then
            sed -i "s/implementation project(':capacitor-android')/implementation project(':capacitor-android')\n    implementation 'com.unity3d.ads:unity-ads:4.16.6'/" "$GRADLE_FILE"
          fi
          echo "----- app/build.gradle dependencies -----"
          grep -A 12 "dependencies {" "$GRADLE_FILE" | head -15

      - name: İnternet izinlerini garantile
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "ACCESS_NETWORK_STATE" "$MANIFEST"; then
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />#' "$MANIFEST"
          fi

      - name: Web dosyalarını native projeye senkronize et
        run: npx cap sync android

      - name: APK derle (debug — test için imzasız/otomatik imzalı)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK'yı yükle (indirilebilir çıktı)
        uses: actions/upload-artifact@v4
        with:
          name: ioz-internet-cafe-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
