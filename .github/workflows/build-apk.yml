name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed so the last step can commit docs/version.json back
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java (JDK 21) kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Capacitor bağımlılıklarını kur
        run: |
          npm install
          npm install @capacitor/app
        

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Eklentileri native projeye yerleştir (Unity Ads + Billing)
        run: |
          APP_ID=$(node -e "console.log(require('./capacitor.config.json').appId)")
          PKG_PATH="android/app/src/main/java/$(echo $APP_ID | tr '.' '/')"
          mkdir -p "$PKG_PATH"
          sed "s/^package .*/package $APP_ID;/" android-plugin/UnityAdsBridge.kt > "$PKG_PATH/UnityAdsBridge.kt"
          sed "s/^package .*/package $APP_ID;/" android-plugin/BillingBridge.kt > "$PKG_PATH/BillingBridge.kt"
          cat > "$PKG_PATH/MainActivity.java" <<JAVAEOF
          package $APP_ID;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(UnityAdsBridge.class);
                  registerPlugin(BillingBridge.class);
                  super.onCreate(savedInstanceState);
                  // Draw behind the notch/cutout instead of boxing the WebView
                  // in below it — without this, devices with a display cutout
                  // render the top slice of the game off-screen ("ekran yarı
                  // kesilmiş").
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      getWindow().getAttributes().layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  enableImmersiveFullscreen();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  // The system bars can silently reclaim their space the moment
                  // focus returns (app switcher, a permission dialog, etc.) —
                  // re-apply here or the game randomly reverts to a half-cut
                  // layout after backgrounding instead of staying fullscreen.
                  if (hasFocus) enableImmersiveFullscreen();
              }

              private void enableImmersiveFullscreen() {
                  // Android 11+ (API 30): the modern, reliable API. The old
                  // View.SYSTEM_UI_FLAG_* constants below are deprecated on
                  // these versions and — on several OEM skins — silently fail
                  // to hide the NAVIGATION bar specifically (status bar hides
                  // fine, nav bar stays and eats taps meant for the game's
                  // bottom buttons). This is the fix for exactly that.
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      getWindow().setDecorFitsSystemWindows(false);
                      WindowInsetsController controller = getWindow().getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(
                              WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );
                      }
                      return;
                  }
                  // Android 10 and below: legacy immersive-sticky flags.
                  View decorView = getWindow().getDecorView();
                  decorView.setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );
              }
          }
          JAVAEOF
          cat "$PKG_PATH/MainActivity.java"

      - name: Kotlin desteğini Android projesine ekle
        run: |
          ROOT_GRADLE="android/build.gradle"
          if ! grep -q "kotlin-gradle-plugin" "$ROOT_GRADLE"; then
            sed -i "s/classpath 'com.android.tools.build:gradle:[^']*'/&\n        classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24\"/" "$ROOT_GRADLE"
          fi
          APP_GRADLE="android/app/build.gradle"
          if ! grep -q "kotlin-android" "$APP_GRADLE"; then
            sed -i "s/apply plugin: 'com.android.application'/apply plugin: 'com.android.application'\napply plugin: 'kotlin-android'/" "$APP_GRADLE"
          fi

      - name: Unity Ads Gradle bağımlılığını ekle
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if ! grep -q "com.unity3d.ads:unity-ads" "$GRADLE_FILE"; then
            sed -i "s/implementation project(':capacitor-android')/implementation project(':capacitor-android')\n    implementation 'com.unity3d.ads:unity-ads:4.16.6'/" "$GRADLE_FILE"
          fi

      - name: Play Billing Gradle bağımlılığını ekle
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if ! grep -q "com.android.billingclient:billing" "$GRADLE_FILE"; then
            sed -i "s/implementation project(':capacitor-android')/implementation project(':capacitor-android')\n    implementation 'com.android.billingclient:billing:8.3.0'/" "$GRADLE_FILE"
          fi

      - name: İnternet izinlerini garantile
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "ACCESS_NETWORK_STATE" "$MANIFEST"; then
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />#' "$MANIFEST"
          fi

      - name: Billing iznini garantile
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "com.android.vending.BILLING" "$MANIFEST"; then
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="com.android.vending.BILLING" />#' "$MANIFEST"
          fi

      - name: Uygulama ikonunu yerleştir (tek kaynak resimden 5 boyuta otomatik böl)
        run: |
          # android-icons/ klasöründe artık tek bir kaynak resim var: icon.png.
          # Play/Android'in istediği 5 farklı boyutu (mdpi→xxxhdpi) burada
          # Python/Pillow ile otomatik üretiyoruz (ImageMagick'in runner'da
          # her zaman `convert` adıyla bulunamaması sorununu ortadan kaldırır)
          # — repoda 10 ayrı dosyayla uğraşmaya gerek yok, sadece bu tek
          # dosyayı güncel tutman yeterli.
          SRC="android-icons/icon.png"
          test -s "$SRC" || (echo "HATA: android-icons/icon.png bulunamadı" && exit 1)
          pip install --quiet --break-system-packages Pillow
          python3 - "$SRC" <<'PYEOF'
          import sys
          from PIL import Image
          import os
          src = Image.open(sys.argv[1]).convert("RGB")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for dpi, px in sizes.items():
              dest = "android/app/src/main/res/mipmap-" + dpi
              os.makedirs(dest, exist_ok=True)
              resized = src.resize((px, px), Image.LANCZOS)
              resized.save(dest + "/ic_launcher.png")
              resized.save(dest + "/ic_launcher_round.png")
          print("İkonlar 5 boyutta üretildi.")
          PYEOF
          ANYDPI="android/app/src/main/res/mipmap-anydpi-v26"
          if [ -d "$ANYDPI" ]; then rm -f "$ANYDPI"/*.xml; fi

      - name: Sürüm numarasını (versionCode) otomatik artır + app-version.json yaz
        run: |
          APP_GRADLE="android/app/build.gradle"
          # github.run_number bu workflow her çalıştığında 1 artar, asla geriye
          # gitmez veya tekrar etmez — Play Store'un istediği "her yüklemede
          # daha yüksek versionCode" kuralını garanti eder.
          NEW_CODE=${{ github.run_number }}
          NEW_NAME="6.0.${{ github.run_number }}"
          sed -i "s/versionCode [0-9]\+/versionCode $NEW_CODE/" "$APP_GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"$NEW_NAME\"/" "$APP_GRADLE"
          echo "versionCode=$NEW_CODE, versionName=$NEW_NAME olarak ayarlandı."
          grep -E "versionCode|versionName" "$APP_GRADLE"
          # Aynı sürüm numarasını, oyunun kendisinin ("bu APK hangi sürüm?")
          # bilmesi için www/ içine de yazıyoruz — bu dosya APK'nın içine
          # gömülür ve zorunlu-güncelleme kontrolünde "benim sürümüm" olarak
          # kullanılır. cap sync'ten ÖNCE burada olması şart, yoksa APK'nın
          # içine hiç girmez.
          echo "{\"versionCode\": $NEW_CODE, \"versionName\": \"$NEW_NAME\"}" > www/app-version.json
          cat www/app-version.json

      - name: Web dosyalarını native projeye senkronize et
        run: npx cap sync android

      - name: Sabit keystore'u geri yükle (ilk sürümü imzalayan anahtar)
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks
          # Dosyanın boş/bozuk gelmediğini erken fark etmek için boyut kontrolü
          test -s android/app/release-key.jks || (echo "HATA: KEYSTORE_BASE64 secret'i boş veya eksik" && exit 1)
          echo "Dosya boyutu: $(stat -c%s android/app/release-key.jks) bayt"

      - name: Keystore'un şifre/alias ile açıldığını erkenden doğrula
        run: |
          if ! keytool -list -keystore android/app/release-key.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "HATA: keystore, verilen KEYSTORE_PASSWORD/KEY_ALIAS ile açılamadı."
            echo "İhtimaller: (1) KEYSTORE_BASE64 secret'i eksik/bozuk yapıştırılmış, (2) bu keystore aslında farklı bir şifre/alias ile üretilmiş."
            exit 1
          fi
          echo "Keystore doğrulandı, alias '$KEY_ALIAS' bulundu."

      - name: İmzalama ayarlarını build.gradle'a ekle
        run: |
          APP_GRADLE="android/app/build.gradle"
          if ! grep -q "signingConfigs {" "$APP_GRADLE"; then
            SIGNING=$(printf '    signingConfigs {\n        release {\n            storeFile file("release-key.jks")\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASSWORD")\n        }\n    }')
            awk -v block="$SIGNING" '{print} /android {/ && !done {print block; done=1}' "$APP_GRADLE" > /tmp/bg.tmp && mv /tmp/bg.tmp "$APP_GRADLE"
          fi
          if ! grep -q "signingConfig signingConfigs.release" "$APP_GRADLE"; then
            awk '{print} /buildTypes[[:space:]]*{/ {inBT=1} inBT && /release[[:space:]]*{/ && !done {print "            signingConfig signingConfigs.release"; done=1}' "$APP_GRADLE" > /tmp/bg2.tmp && mv /tmp/bg2.tmp "$APP_GRADLE"
          fi

      - name: AAB derle (Release, imzalı)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: APK derle (Release, imzalı)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: AAB'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: ioz-internet-cafe-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: ioz-internet-cafe-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: docs/version.json güncelle (zorunlu güncelleme kontrolü için)
        run: |
          # Build başarıyla bitti demek ki bu versionCode artık gerçek,
          # Play Store'a yüklenebilir bir sürüm — GitHub Pages'teki
          # version.json'ı da buna göre güncelleyip repoya geri commit
          # ediyoruz. Oyun her açılışta bu dosyayı okuyup kendi sürümüyle
          # karşılaştırıyor (bkz. game.js: checkForUpdate).
          mkdir -p docs
          cat > docs/version.json <<VERSIONEOF
          {
            "latestVersionCode": ${{ github.run_number }},
            "updateUrl": "https://play.google.com/store/apps/details?id=com.iozgames.iozcafe"
          }
          VERSIONEOF
          cat docs/version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/version.json
          if git diff --staged --quiet; then
            echo "version.json zaten güncel, commit atılmadı."
          else
            git commit -m "chore: latestVersionCode -> ${{ github.run_number }} [skip ci]"
            git push origin HEAD:main
          fi
